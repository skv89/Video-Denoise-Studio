name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-311:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-denoise-build.txt

      - name: Install hash-pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-denoise-build.txt

      - name: Compile source and tests
        run: python -X dev -W error::ResourceWarning -m compileall -q denoise_main.py deinterlace_main.py video_denoise_studio video_denoise_tests deinterlace_studio deinterlace_tests

      - name: Run Video Denoise Studio tests
        run: python -X dev -W error::ResourceWarning -m unittest discover -s video_denoise_tests -v

      - name: Run shared-core regression tests
        run: python -X dev -W error::ResourceWarning -m unittest discover -s deinterlace_tests -q
